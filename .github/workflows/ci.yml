name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_SECRET: ci-only-secret-not-for-production-0000
      # The smoke test runs the production build without Redis on purpose.
      ALLOW_MEMORY_STORE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Typecheck after build so the generated route types (.next/types) are checked too.
      - run: npm run typecheck
      - name: Smoke test production server
        run: |
          npx next start -p 3100 &
          for i in $(seq 1 30); do curl -sf http://localhost:3100/api/health && break; sleep 1; done
          curl -sf http://localhost:3100/ > /dev/null
          curl -sf http://localhost:3100/vehicles/xiaomi-su7 > /dev/null
          curl -sf http://localhost:3100/sitemap.xml > /dev/null
          curl -sf -X POST http://localhost:3100/api/trip/plan -H 'Content-Type: application/json' \
            -d '{"originId":"beijing","destinationId":"shanghai","vehicleSlug":"xiaomi-su7","trimId":"pro","startSoc":90,"minArrivalSoc":15,"network":"any"}' > /dev/null

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mitesla-atelier:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
